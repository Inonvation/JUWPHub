# Android CI：单元测试 + 动效字面量护栏 + 打包冒烟
#
# ── 动效字面量检查失败时怎么看 ────────────────────────────────────
# 那一步跑的是 `scripts/check-motion-literals.ps1`，输出形如：
#     app/src/main/java/edu/jxslu/schedule/ui/week/WeekScreen.kt:123: animationSpec = tween(240),
# 按 `ui/theme/Motion.kt` 文件头的归并表换成 `Motion.tap()/state()/reveal()/page()`
# （90 / 180 / 220 / 280，另有 `pageExit()` 同长、加速曲线）。
# 退出码：0 干净、1 有命中、2 找不到源码目录（2 同样算失败，别当成"没扫到所以没事"）。
#
# 例外清单写死在脚本的 `$Excluded` 里（Motion.kt 自身、引导页逐段编排、无限循环周期、
# Ujing 洗涤进度）。**新增例外必须同时改两处**：脚本的 `$Excluded` 与
# `.agents/rules/ui-common.md` 的「动效口径 → 验收命令」一节——只改一处就会出现
# 「文档说绿、脚本说红」的分裂。
#
# 注：脚本必须存成 UTF-8 **with BOM**。Windows PowerShell 5.1 读无 BOM 的 .ps1 会按
# 系统 ANSI 解码，中文注释变乱码后直接语法错误；CI 的 pwsh 7 无所谓，但本地要能跑。

name: Android CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：CI 只读仓库，不需要写 issue / 评论 / 包。
permissions:
  contents: read

jobs:
  unit-test-and-build:
    runs-on: ubuntu-latest
    # 防跑飞：R8 那步卡住时默认要等 6 小时才判超时，白占 runner。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 依赖与 wrapper 缓存：Public repo 免 secrets，Gradle 8.11.1 wrapper 直接可用
      - uses: gradle/actions/setup-gradle@v4

      # shell: pwsh —— 脚本是 .ps1，ubuntu-latest 自带 pwsh 7。
      # 脚本用 $PSScriptRoot 定位仓库根，不依赖 CWD。
      # 放在单测之前：这一条只读源码、秒级完成，先失败就不用等编译。
      - name: 动效字面量检查（ui/theme/Motion.kt 是唯一来源）
        shell: pwsh
        run: ./scripts/check-motion-literals.ps1

      - name: 单元测试
        run: ./gradlew :app:testDebugUnitTest

      - name: 组装 Debug APK
        run: ./gradlew :app:assembleDebug

      # R8 的问题不在编译期暴露（AGENTS.md 记了三个坑），只跑 debug 挡不住整类问题。
      # CI 上没有 keystore.properties，build.gradle.kts 会回退 debug 签名并打一条 warning，构建照样过。
      - name: 组装 Release APK（R8 冒烟）
        run: ./gradlew :app:assembleRelease

      - name: 上传测试报告（失败时定位用）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/
