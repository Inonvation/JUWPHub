# iOS 编译快检（macos-26，2026-11-25）
#
# 为什么单独开一条：`ios-ipa.yml` 用的 `macos-15` 池在 2026-11-24/25 反复排满 10–15 分钟
# 拿不到机器（job 结论 `cancelled`、`runner_name` 空、`steps=0`），而 iOS 侧代码**只有
# macOS 能编译**——Windows 上 `compileKotlinIosArm64` 直接 SKIPPED。结果是每改一行 iosMain
# 都要赌一次排队。
#
# `runner-probe.yml` 实测 `macos-26` 是**另一个独立池**（`macos-26-arm64`，Xcode 26.6），
# 所以这里用它跑**只要编译、不打包**的快检：与 IPA 那条并行排队，谁先拿到机器谁先给信号。
#
# 两个 workflow 的分工：
# - 本文件：只跑 `:shared:compileKotlinIosArm64`，给「代码能不能过 Kotlin/Native」这一个答案；
# - `ios-ipa.yml`：完整链路（链接 framework → xcodegen → xcodebuild → 打 IPA）。
#
# 注意：Xcode 26 与 Kotlin 2.1.21 的兼容性**没有实测过**。若这里失败而 `ios-ipa.yml` 通过，
# 说明是工具链版本问题、不是代码问题——看报错里有没有 `Xcode version` 字样再判断。

name: iOS Compile (macos-26)

on:
  push:
    branches: [feat/ios-port]
    paths:
      - 'shared/**'
      - '.github/workflows/ios-compile-m26.yml'
  workflow_dispatch:

concurrency:
  # 同一条分支只留一个：这是快检，新的覆盖旧的才有意义
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 配置阶段会连带配置 `:app`（AGP 要 compileSdk 36）
      - name: 装 Android SDK 36
        run: |
          SDK="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMGR" || SDKMGR="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: 缓存 Kotlin/Native 工具链（~/.konan）
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-m26-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'shared/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: konan-m26-${{ runner.os }}-

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 打印工具链
        run: |
          xcodebuild -version
          uname -m

      # 只要编译，不链接、不打包
      - name: 编译 iosArm64
        run: ./gradlew :shared:compileKotlinIosArm64 --stacktrace
