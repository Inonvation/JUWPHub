# iOS 编译闸门（2026-11-24，iOS 移植 P0 之后）
#
# 为什么单独开一个 workflow：Android CI 跑在 ubuntu-latest 上，而 Kotlin/Native 的 Apple
# target **只能在 macOS 上编**（Windows 上 KGP 会直接把 iosArm64 / iosSimulatorArm64
# 禁掉，任务被跳过、构建「成功」但什么都没编）。所以 iOS 侧到底能不能编，只有 macOS runner
# 能回答。仓库是 public，macOS runner 免费。
#
# 它验的是 `:shared` —— 也就是 `:app` 之外那 157 个文件（domain 全量 + wire model +
# ui/theme + ui/icon + 6 个已迁移的网络客户端）在 Kotlin/Native 上真的编得过。
#
# 与本地 `:shared:metadataCommonMainClasses` 的区别（两个都要跑，别互相替代）：
# - 元数据编译只证明「commonMain 里没有 JVM 专有 API」；
# - 这里证明「用到的 API 在 Native 侧真的存在、签名也对」，以及 `androidMain` / `iosMain`
#   里那些**从未编译过**的 actual 实现（`PlatformFormat` / `Barcode` / `Logger` /
#   `PlatformDynamicColorScheme` / 动画缩放）到底通不通。
# 预计首次会红：iosMain 的 5 个 actual 是照着文档推的，没有一行经过编译器。

name: iOS Compile

on:
  # 2026-11-24 起 push 不再触发本 workflow：它与 `ios-ipa.yml` 都在 push 时启动，
  # 两个 macOS 任务同时抢 runner，实测会互相饿死（run 45363244752 报
  # "The job was not acquired by Runner of type hosted even after multiple attempts"）。
  # 现在 push 走 ios-ipa（它内部先 compile + link，等于含了本 workflow 的验证）；
  # 这里只留 PR 与手工触发，用来在不打 IPA 时快速验一遍编译。
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-shared-ios:
    # 只在 macOS 上能编 Apple target；macos-15 自带 Xcode 16 + Kotlin/Native 需要的工具链
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 配置阶段会连带配置 `:app`（AGP 要 compileSdk 36 的平台），
      # 所以 macOS 上也得把 Android SDK 装齐，否则会在配置期就失败，
      # 报「Failed to find target with hash string 'android-36'」而不是我们想看的那类错。
      #
      # 不用 `android-actions/setup-android@v3`：它会去装一个叫 `tools` 的包，
      # 而新版 SDK 仓库里已经没有这个包，2026-11-24 实测直接
      # `Warning: Failed to find package 'tools'` + exit 1（见 run 45354030959）。
      # macOS runner 自带 Android SDK，直接用它自带的 sdkmanager 就够。
      - name: 装 Android SDK 36
        run: |
          SDK="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
          echo "SDK=$SDK"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMGR" || SDKMGR="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)"
          echo "sdkmanager=$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # ~/.konan 不在 Gradle User Home 里，setup-gradle 管不到它。Kotlin/Native 的
      # LLVM / libffi / sysroot 冷启动要下载并解压 40s 以上（实测 `Downloading native
      # dependencies (LLVM, sysroot etc)`），而它们只在 Kotlin 版本或 Gradle 配置变化时才失效。
      - name: 缓存 Kotlin/Native 工具链（~/.konan）
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'shared/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: konan-${{ runner.os }}-

      # `cache-read-only: false` 是必须写的，不是冗余：gradle/actions **只从默认分支写缓存**，
      # 特性分支上默认就是只读。实测日志（2026-11-24，run 45360577520）：
      #   Cache is read-only: will not save state for use in subsequent builds.
      #   Gradle User Home cache not found. Will initialize empty.
      # 于是每次 run 全冷——Gradle 发行包重下 1m29s、依赖全下、LLVM 重下。
      # GitHub 缓存本来就按分支隔离，放开写只影响本分支自己的后续 run。
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 打印工具链版本（失败时定位用）
        run: |
          xcodebuild -version
          java -version

      # 编译 + 链接两步都要：
      # - `compileKotlin*` 验「代码能不能编」；
      # - `linkDebugFrameworkIosArm64` 验「产物能不能被 Xcode 消费」——链接会检查 `:shared`
      #   的导出面（Kotlin/Native 导出不了的泛型、内联类、默认参数之类只在链接期暴露）。
      #   framework 已在 shared/build.gradle.kts 里声明为 `Shared`（static）。
      #   **链接占本步一半时间**（实测 2m50s / 8m45s），所以只链设备那份。
      #
      # 不再链 `linkDebugFrameworkIosSimulatorArm64`（原 1m21s）：CI 里没有任何一条路径
      # 拿模拟器 framework 去跑——没有 iosSimulatorArm64Test，也没人对模拟器 xcodebuild。
      # 模拟器产物由 mac 本地按需构建（Xcode 跑预览/模拟器时才需要）。
      # 模拟器的**编译**留着（30s，且是 mac 侧 Xcode 直接用的 target）。
      - name: 编译并链接 :shared 的 iOS klib 与 framework
        run: |
          ./gradlew \
            :shared:compileKotlinIosArm64 \
            :shared:compileKotlinIosSimulatorArm64 \
            :shared:linkDebugFrameworkIosArm64 \
            --stacktrace

      # 把 framework 的路径与大小打出来：P3 建 iosApp 时要链它，路径写死容易过期。
      - name: 报告 framework 产物
        run: |
          find shared/build/bin -name "*.framework" -maxdepth 6 -print -exec du -sh {} \; || true
