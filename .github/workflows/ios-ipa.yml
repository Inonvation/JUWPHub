# 打 unsigned IPA（2026-11-24，iOS 移植 P3）
#
# 目的：**先让包能装到 iPhone 上跑起来**，再谈功能。这一版装上去看到的是链路验证屏
# （`shared/src/commonMain/.../ui/LinkValidationScreen.kt`），故意把「iOS 的定点小数
# 与 Android 是否一致」这个唯一已知运行期风险直接显示在屏幕上。
#
# 为什么是 unsigned：签一个能装的 IPA 需要 Apple 开发者证书。这里只产出**未签名**的
# `Payload/JUWPHub.app` 打包，用户侧用 Sideloadly / SideStore 自签后安装
# （免费 Apple ID 7 天、最多 3 个 App；¥688/年 开发者账号 1 年）。
#
# 与 ios-compile.yml 的分工：push 只走本 workflow（见 `on:` 里的注释），
# 所以它是 push 路径上唯一的 iOS 闸门：compile + link arm64 + xcodegen + xcodebuild + 打包。
# ios-compile 只留 PR 与手工触发，用来在不打 IPA 时快速验一遍编译。
#
# 提速靠缓存，不靠少跑：
# - Gradle User Home 缓存显式可写（gradle/actions 默认只在默认分支写）；
# - ~/.konan 单独用 actions/cache 管（不在 Gradle User Home 范围内）；
# - 只链 arm64，模拟器 framework 不在 CI 构建（CI 里没有一条路径消费它）。

name: iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [feat/ios-port]
    # `shared/**` 必须在：push 只走本 workflow（ios-compile 已改为只在 PR / 手工触发），
    # 拿掉它，改共享层就再没有任何 iOS 编译验证。
    paths:
      - 'iosApp/**'
      - 'shared/**'
      - '.github/workflows/ios-ipa.yml'

concurrency:
  # 不要 cancel-in-progress：这个 workflow 一次要排 10+ 分钟队、再跑 6~10 分钟，
  # 被新触发掐掉等于白等。2026-11-24 实测 run 45365806747 就是这么被取消的
  # （Canceling since a higher priority waiting request exists）。
  # 改成排队：新的等旧的跑完。
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-ipa:
    # 必须是 arm64 机器：`-arch arm64` 与 `:shared:linkDebugFrameworkIosArm64` 都依赖它。
    # 本仓库是公开仓库，`macos-15` 分配的就是 arm64。
    #
    # 试过并失败的路：`macos-14`（2026-11-25）—— 秒退，check-run 注解为
    # `The configuration 'macos-14-arm64-us-default' is not supported`，
    # 即该标签在本仓库已没有 arm64 机器。**不支持的标签不会排队，而是立刻 cancelled、
    # steps=0**，与容量不足的「排满 15 分钟再 cancelled」现象相同、原因不同，
    # 区分办法见 `.github/workflows/runner-probe.yml`。
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 配置阶段会连带配置 `:app`（AGP 要 compileSdk 36），macOS 上也要装齐
      - name: 装 Android SDK 36
        run: |
          SDK="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMGR" || SDKMGR="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # 两个缓存都显式打开：gradle/actions 默认只在 main 上写缓存，特性分支是只读的
      # （理由和实测日志见 ios-compile.yml 同名步骤）。~/.konan 不在 Gradle User Home 里，
      # 必须单独用 actions/cache 管。
      - name: 缓存 Kotlin/Native 工具链（~/.konan）
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'shared/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: konan-${{ runner.os }}-

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # 只链设备用的 arm64 framework；模拟器那份不在 CI 里构建（见 ios-compile.yml）
      - name: 链接 Shared.framework（device arm64）
        run: ./gradlew :shared:linkDebugFrameworkIosArm64 --stacktrace

      # 工程是生成的，不把 .xcodeproj 提交进仓库（见 iosApp/project.yml 文件头）
      # macos-15 镜像已带 xcodegen 时跳过 brew（brew update 本身就要几十秒）
      - name: 安装 xcodegen
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: iosApp
        run: xcodegen generate

      - name: 打印工具链
        run: |
          xcodebuild -version
          ls -la iosApp

      # Release 而不是 Debug：Xcode 15+ 的 Debug 构建会把代码放进 `JUWPHub.debug.dylib`
      # （实测 59MB，主二进制只剩 71KB 的壳，还带一个 `__preview.dylib`）。那种包侧载后容易
      # 装不上/起不来。Release 把 Kotlin 的静态 framework 直接链进主二进制，产物干净。
      #
      # 注意：Kotlin 侧仍链 **debug** framework（`linkDebugFrameworkIosArm64`）——它与 Xcode 的
      # 优化级别无关，功能等价且 CI 快。
      # shortcut: 出正式分发包时改成 linkReleaseFrameworkIosArm64 并同步 FRAMEWORK_SEARCH_PATHS
      # 到 releaseFramework；现在不动，是为了少一个变量、先把链路跑通。
      - name: xcodebuild（Release，不签名）
        run: |
          xcodebuild \
            -project iosApp/JUWPHub.xcodeproj \
            -scheme JUWPHub \
            -sdk iphoneos \
            -arch arm64 \
            -configuration Release \
            -derivedDataPath iosApp/build \
            ENABLE_DEBUG_DYLIB=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成 unsigned IPA
        run: |
          APP="iosApp/build/Build/Products/Release-iphoneos/JUWPHub.app"
          test -d "$APP" || { echo "::error::找不到 $APP"; find iosApp/build -name "*.app" -maxdepth 6; exit 1; }
          # Release 包里不该再有 debug dylib；有就说明没走 Release，直接失败而不是交付坏包
          if ls "$APP"/*.debug.dylib >/dev/null 2>&1; then
            echo "::error::产物里还有 debug dylib，说明配置没生效"
            ls -la "$APP"
            exit 1
          fi
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry JUWPHub-unsigned.ipa Payload
          ls -lh JUWPHub-unsigned.ipa
          echo "--- Payload 内容 ---"
          unzip -l JUWPHub-unsigned.ipa | head -20
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" Payload/JUWPHub.app/Info.plist || true

      # 2026-11-26 加：真机的现象是「图标一闪就回桌面、没有任何崩溃报告、文件 App 里
      # 连 logs 目录都没有」——这三点合起来说明崩在 Kotlin 之前（dyld / 包体 / 签名）。
      # 用户拿不到设备日志，所以把包体事实打进 CI 日志，下次排查不用再靠猜。
      #
      # 全部只读打印，不改产物、不加任何构建参数。**别删这一段**：它是这条链上唯一
      # 能看到「产出的到底是个什么样的包」的地方。
      - name: 打印包体事实（闪退排查用）
        run: |
          APP="out/Payload/JUWPHub.app"
          echo "=== 可执行文件架构 ==="
          lipo -info "$APP/JUWPHub" || true
          echo "=== 最低系统版本（minos / LC_BUILD_VERSION）==="
          otool -l "$APP/JUWPHub" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS" || true
          echo "=== rpath（指向不存在的目录会让 dyld 直接杀进程）==="
          otool -l "$APP/JUWPHub" | grep -A2 LC_RPATH || true
          echo "=== 依赖的动态库 ==="
          otool -L "$APP/JUWPHub" || true
          echo "=== 包内目录 ==="
          ls -la "$APP" || true
          echo "=== 嵌套 framework / dylib（Shared 是静态链接，这里应该一个都没有）==="
          find "$APP" \( -name "*.framework" -o -name "*.dylib" \) | head -20 || true
          echo "=== Info.plist 关键项 ==="
          for k in CFBundleIdentifier CFBundleExecutable CFBundlePackageType \
                   CFBundleShortVersionString CFBundleVersion MinimumOSVersion \
                   LSRequiresIPhoneOS UILaunchScreen CADisableMinimumFrameDurationOnPhone \
                   UIRequiredDeviceCapabilities UISupportedInterfaceOrientations \
                   UIFileSharingEnabled; do
            printf '%s = ' "$k"
            /usr/libexec/PlistBuddy -c "Print :$k" "$APP/Info.plist" 2>/dev/null || echo "(缺)"
          done
          echo "=== Assets.car（App 图标与 LaunchBackground 都在里面）==="
          ls -la "$APP/Assets.car" 2>/dev/null || echo "(缺 Assets.car)"

      - uses: actions/upload-artifact@v4
        with:
          name: JUWPHub-unsigned-ipa
          path: out/JUWPHub-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
