# XcodeGen 工程描述（P3，2026-11-24）
#
# 为什么用 xcodegen 而不是把 .xcodeproj/project.pbxproj 提交进来：
# pbxproj 是二进制风格的老式 plist，手写几乎必错、且 diff 不可读。这里用一份 YAML
# 描述工程，CI 上 `xcodegen generate` 现场生成 —— 工程结构改动在 diff 里一眼能看懂。
#
# 生成：cd iosApp && xcodegen generate
# 生成的 JUWPHub.xcodeproj 不入库（见 iosApp/.gitignore）。

name: JUWPHub

options:
  bundleIdPrefix: edu.jxslu.schedule
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"

targets:
  JUWPHub:
    type: application
    platform: iOS
    sources:
      - path: JUWPHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.jxslu.schedule.ios
        PRODUCT_NAME: JUWPHub
        INFOPLIST_FILE: JUWPHub/Info.plist
        # App 图标来自 JUWPHub/Assets.xcassets（1024 单尺寸，Xcode 14+ 的 universal 口径）。
        # 源图是 tools/app-icon/source.png 的前景层重新合成的满幅图——**不要**直接用
        # source.png：那版把圆角与投影烤进了像素，iOS 自己还会再套一层遮罩，变成双层圆角。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 只发 iPhone（这个 App 没有 iPad 布局，声明成 universal 反而会被审核要求截图）
        TARGETED_DEVICE_FAMILY: "1"
        # 生成的工程在 iosApp/ 下，所以 SRCROOT = iosApp/，共享模块在上一级
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/bin/iosArm64/debugFramework
        # `-framework Shared` 是主依赖；后面几个是 Kotlin/Native 静态 framework 需要的系统库
        # （静态库不携带自己的 load command，符号要靠这里解析）。多写不报错，漏写会
        # 报 Undefined symbols，所以宁可写全。
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
          - -framework
          - CoreImage
          - -framework
          - CoreGraphics
          - -framework
          - CoreFoundation
          - -framework
          - CoreText
          - -framework
          - QuartzCore
          - -framework
          - Metal
          - -framework
          - UIKit
          - -framework
          - Foundation
          # `UTTypeJSON` / `UTTypePlainText`（文件选择器允许的类型，iOS 14+）在这个框架里。
          # 静态 framework 不带 load command，漏了这一行链接时报 Undefined symbols。
          - -framework
          - UniformTypeIdentifiers
          # `UNUserNotificationCenter` / `UNTimeIntervalNotificationTrigger`（洗衣完成提醒，
          # 2026-11-25 晚）在这个框架里。同一条纪律：静态 framework 不自带 load command，
          # 少了这行是链接期 Undefined symbols，不会在 Kotlin 编译期报出来。
          - -framework
          - UserNotifications
          # `MKMapView` / `MKPolygon` / `MKAnnotationView`（快趣单车地图的 MapKit 实现，
          # 2026-11-25 晚）在这个框架里。同一条纪律：静态 framework 不自带 load command，
          # 少了这行是链接期 Undefined symbols，Kotlin 编译期不会报。
          - -framework
          - MapKit
          # `EKEventStore` / `EKEvent` / `EKAlarm`（课表写入系统日历，shared/.../ui/week/
          # IosCalendarSync.kt，2026-11-26）在这个框架里。同一条纪律：静态 framework
          # 不自带 load command，漏了是链接期 Undefined symbols。
          - -framework
          - EventKit
          # `AVCaptureSession` / `AVCaptureVideoPreviewLayer` / `AVCaptureMetadataOutput`
          # （快趣「扫车身码」的取景页，shared/.../ui/ebike/IosBikeScan.kt，2026-11-26）在这个框架里。
          # 同一条纪律：静态 framework 不自带 load command，漏了是链接期 Undefined symbols，
          # Kotlin 编译期不会报——症状是 CI 一路绿到链接步骤才炸。
          - -framework
          - AVFoundation
          # `CBCentralManager` / `CBPeripheral` / `CBService`（趣智校园的蓝牙水控，
          # shared/.../data/qzxy/IosQzxyBle.kt，2026-11-28）在这个框架里。
          # 同一条纪律：静态 framework 不自带 load command，漏了是链接期 Undefined symbols，
          # Kotlin 编译期不会报——症状是 CI 一路绿到链接步骤才炸。
          - -framework
          - CoreBluetooth
